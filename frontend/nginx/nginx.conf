server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;

    # Behind a reverse proxy: emit relative Location headers so redirects do not
    # leak the internal listen port.
    absolute_redirect off;
    index index.html;

    # Build output is content-hashed, so it can be cached indefinitely.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side-render fallback shell, never meant to be requested directly.
    location = /index.csr.html {
        return 404;
    }

    location = /index.html {
        return 301 /;
    }

    # Legacy URLs from the previous site (e.g. /impressum.html) are still indexed.
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # One canonical URL per page: no trailing slash except on the root.
    location ~ ^(/.+)/$ {
        return 301 $1;
    }

    # Every route is prerendered to <route>/index.html. Unknown paths must 404
    # rather than silently returning the app shell (soft 404).
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    error_page 404 /404/index.html;

    location = /404/index.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}
