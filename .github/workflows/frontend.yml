name: frontend

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend.yml

jobs:
  docker-build-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          # ghcr akzeptiert nur Kleinbuchstaben im Pfad, deshalb fest
          # eingetragen statt aus github.repository_owner abgeleitet.
          tags: ghcr.io/ferencovonmatterhorn/therapiezentrum-horvay-frontend:latest
